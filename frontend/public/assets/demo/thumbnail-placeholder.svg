<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#142442" />
      <stop offset="60%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#04060b" />
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="nebulaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)" />
  <circle cx="210" cy="140" r="110" fill="url(#nebulaGrad)" filter="blur(20px)" />
  <!-- Stars Background -->
  <g fill="#ffffff">
    <circle cx="34" cy="45" r="1" opacity="0.8" />
    <circle cx="88" cy="120" r="1.5" opacity="0.9" />
    <circle cx="140" cy="30" r="0.8" opacity="0.6" />
    <circle cx="180" cy="85" r="1.2" opacity="0.75" />
    <circle cx="250" cy="40" r="1.8" opacity="0.85" />
    <circle cx="310" cy="95" r="1" opacity="0.7" />
    <circle cx="360" cy="50" r="1.4" opacity="0.9" />
    <circle cx="45" cy="220" r="1.2" opacity="0.8" />
    <circle cx="110" cy="190" r="0.8" opacity="0.5" />
    <circle cx="160" cy="245" r="1.5" opacity="0.7" />
    <circle cx="270" cy="225" r="1" opacity="0.8" />
    <circle cx="330" cy="210" r="1.3" opacity="0.85" />
    <circle cx="375" cy="265" r="1.6" opacity="0.9" />
  </g>
  <!-- Central Target Source with Diffraction Spikes -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="32" fill="url(#starGlow)" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#93c5fd" stroke-width="0.8" opacity="0.8" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#93c5fd" stroke-width="0.8" opacity="0.8" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#60a5fa" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.7" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.5" />
  </g>
  <!-- Calibrated HUD Header -->
  <rect x="14" y="14" width="372" height="28" rx="6" fill="#091322" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5" />
  <text x="200" y="32" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.05em">
    NASA SPHEREx DR1 · VERIFIED ARCHIVE CUTOUT
  </text>
  <!-- Bottom Coordinate Frame -->
  <rect x="110" y="260" width="180" height="24" rx="5" fill="#091322" stroke="#1e293b" stroke-width="0.8" />
  <text x="200" y="276" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9.5">
    ICRS J2000 · λ 0.75–5.00 μm
  </text>
</svg>
