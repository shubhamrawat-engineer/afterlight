<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#050811" />
  <!-- Astrometric Grid -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4">
    <line x1="0" y1="125" x2="500" y2="125" />
    <line x1="0" y1="250" x2="500" y2="250" />
    <line x1="0" y1="375" x2="500" y2="375" />
    <line x1="125" y1="0" x2="125" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="375" y1="0" x2="375" y2="500" />
  </g>
  <!-- Outer Field Boundary -->
  <rect x="40" y="75" width="420" height="350" fill="none" stroke="#312e81" stroke-width="1.2" stroke-dasharray="6 4" />
  <!-- Reference Field Sources (Invariant) -->
  <g fill="#94a3b8">
    <circle cx="140" cy="160" r="3.5" />
    <text x="150" y="164" fill="#64748b" font-family="monospace" font-size="9">REF-1</text>
    <circle cx="360" cy="175" r="3" />
    <text x="370" y="179" fill="#64748b" font-family="monospace" font-size="9">REF-2</text>
    <circle cx="170" cy="340" r="3" />
    <text x="180" y="344" fill="#64748b" font-family="monospace" font-size="9">REF-3</text>
    <circle cx="345" cy="330" r="3.5" />
    <text x="355" y="334" fill="#64748b" font-family="monospace" font-size="9">REF-4</text>
  </g>
  <!-- Epoch T1 Follow-up Marker (Visibly Distinct for Then/Now & Blink) -->
  <g>
    <circle cx="268" cy="214" r="28" fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="268" cy="214" r="10" fill="#818cf8" fill-opacity="0.45" />
    <circle cx="268" cy="214" r="5.5" fill="#e0e7ff" />
    <text x="268" y="176" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="10" font-weight="bold">
      T1 FOLLOW-UP STATE (CANDIDATE VARIATION)
    </text>
  </g>
  <!-- Top Explicit Disclosure Banner -->
  <rect x="20" y="16" width="460" height="44" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
  <text x="250" y="34" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold">
    DEMONSTRATION PLACEHOLDER — EPOCH T1 (LATER)
  </text>
  <text x="250" y="50" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9.5">
    SYNTHETIC SCHEMATIC DIAGRAM • NOT GENUINE NASA SPHEREx TELEMETRY
  </text>
  <!-- Bottom Status Bar -->
  <rect x="40" y="442" width="420" height="36" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="250" y="464" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10.5">
    ROLE: LATER OBSERVATION (T1 COMPARISON FRAME)
  </text>
</svg>
