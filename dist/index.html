  <body>
    <!-- Hardware-accelerated 4D Relativistic Spacetime Canvas -->
    <canvas id="afterlight-3d-cosmic-canvas"></canvas>

    <!-- Floating 4D Spacetime Telemetry Widget -->
    <div
      id="spacetime-4d-hud"
      class="fixed bottom-3 left-4 z-40 hidden sm:flex items-center gap-2.5 px-3.5 py-1.5 rounded-full border border-cyan-500/30 bg-[#070B14]/85 text-xs font-mono text-cyan-300 backdrop-blur-md shadow-lg pointer-events-none select-none transition-all duration-300"
    >
      <span class="flex h-2 w-2 relative">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-400"></span>
      </span>
      <span class="text-cyan-200 font-semibold tracking-wider">4D SPACETIME:</span>
      <span id="spacetime-t-val" class="text-slate-300">τ = +0.00s</span>
      <span class="text-slate-500">•</span>
      <span id="spacetime-gamma-val" class="text-cyan-400">γ = 1.000</span>
      <span class="text-slate-500">•</span>
      <span class="text-purple-300">SPHEREx 102λ</span>
    </div>

    <div id="root"></div>

    <!-- 4D Relativistic Minkowski Spacetime Physics Engine -->
    <script>
      (function() {
        const canvas = document.getElementById('afterlight-3d-cosmic-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const numStars = 340;
        const stars = [];
        const focalLength = 420;
        let mouseX = 0, mouseY = 0;
        let targetAngleX = 0, targetAngleY = 0;
        let angleX = 0, angleY = 0;
        let velocity = 0;
        let properTime = 0; // The 4th Dimension: Time (tau)
        let lastScrollY = window.scrollY;

        const hudT = document.getElementById('spacetime-t-val');
        const hudGamma = document.getElementById('spacetime-gamma-val');

        const baseStarColors = [
          '#ffffff', // Core white
          '#bae6fd', // Blueshifted cyan (Doppler approaching)
          '#7dd3fc', // Relativistic sky (Doppler approaching)
          '#c084fc', // Temporal ultraviolet
          '#fde047', // Solar rest frame
          '#f472b6'  // Redshifted infrared (Doppler receding)
        ];

        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: (Math.random() - 0.5) * 2400,
            y: (Math.random() - 0.5) * 2400,
            z: Math.random() * 1100 + 1,
            w: Math.random() * Math.PI * 2, // 4th coordinate (hyper-temporal phase)
            size: Math.random() * 1.8 + 0.6,
            color: baseStarColors[Math.floor(Math.random() * baseStarColors.length)],
            speed: Math.random() * 0.4 + 0.25,
            twinkle: Math.random() * 0.03 + 0.01,
            phase: Math.random() * Math.PI * 2
          });
        }

        window.addEventListener('resize', () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        window.addEventListener('mousemove', (e) => {
          mouseX = (e.clientX - width / 2) / (width / 2);
          mouseY = (e.clientY - height / 2) / (height / 2);
          targetAngleX = mouseX * 0.35;
          targetAngleY = mouseY * 0.25;
        });

        window.addEventListener('scroll', () => {
          const dy = Math.abs(window.scrollY - lastScrollY);
          lastScrollY = window.scrollY;
          velocity = Math.min(velocity + dy * 0.05, 8);
        }, { passive: true });

        // Gravitational spacetime ripple on click
        const ripples = [];
        window.addEventListener('click', (e) => {
          ripples.push({
            x: e.clientX,
            y: e.clientY,
            radius: 10,
            maxRadius: 280,
            alpha: 0.65
          });
        });

        let lastTime = performance.now();

        function animate(time) {
          const delta = Math.min((time - lastTime) / 1000, 0.1);
          lastTime = time;

          // 4th Dimension temporal flow
          properTime += delta;
          velocity *= 0.94; // Velocity damping

          // Relativistic Lorentz Factor gamma = 1 / sqrt(1 - v^2/c^2)
          const beta = Math.min(velocity / 12, 0.75); // v/c
          const gamma = 1 / Math.sqrt(1 - beta * beta);

          // Update HUD telemetry
          if (hudT && (Math.floor(properTime * 10) % 2 === 0)) {
            hudT.textContent = 'τ = +' + properTime.toFixed(2) + 's';
          }
          if (hudGamma) {
            hudGamma.textContent = 'γ = ' + gamma.toFixed(3);
          }

          // Smooth lerp for 3D camera rotation
          angleX += (targetAngleX - angleX) * 0.06;
          angleY += (targetAngleY - angleY) * 0.06;

          ctx.clearRect(0, 0, width, height);

          const cx = width / 2;
          const cy = height / 2;

          // 4D Geodesic Spacetime Mesh (connect nearby guide stars in 4D Minkowski space)
          const projectedStars = [];

          for (let i = 0; i < numStars; i++) {
            const star = stars[i];

            // 4th-dimensional time evolution: warp along z with Lorentz dilation
            const effectiveSpeed = star.speed * gamma;
            star.z -= effectiveSpeed * (delta * 60);
            star.w += star.twinkle * gamma;

            if (star.z <= 1) {
              star.z = 1100;
              star.x = (Math.random() - 0.5) * 2400;
              star.y = (Math.random() - 0.5) * 2400;
            }

            // 3D Rotation with mouse angle
            const cosX = Math.cos(angleX);
            const sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY);
            const sinY = Math.sin(angleY);

            // Rotate around Y then X
            let rx = star.x * cosX - star.z * sinX;
            let rz = star.x * sinX + star.z * cosX;
            let ry = star.y * cosY - rz * sinY;
            rz = star.y * sinY + rz * cosY;

            if (rz <= 10) continue;

            // 3D/4D Perspective Projection
            const k = focalLength / rz;
            const px = rx * k + cx;
            const py = ry * k + cy;

            if (px < -30 || px > width + 30 || py < -30 || py > height + 30) continue;

            // Depth + 4th-dimensional temporal twinkle
            const depthRatio = 1 - (rz / 1100);
            star.phase += star.twinkle;
            const twinkleAlpha = 0.6 + Math.sin(star.phase + star.w) * 0.4;
            const alpha = Math.max(0.1, Math.min(1, depthRatio * twinkleAlpha));
            const size = Math.max(0.6, star.size * k * 0.45);

            // Doppler Blueshift / Redshift based on velocity
            let renderColor = star.color;
            if (beta > 0.08) {
              renderColor = depthRatio > 0.5 ? '#7dd3fc' : '#f472b6';
            }

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = renderColor;
            ctx.shadowBlur = depthRatio > 0.65 ? 8 : 0;
            ctx.shadowColor = renderColor;

            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();

            // Optical diffraction spike on bright close stars
            if (depthRatio > 0.78 && star.size > 1.35) {
              ctx.lineWidth = 0.5;
              ctx.strokeStyle = renderColor;
              ctx.beginPath();
              ctx.moveTo(px - size * 3.2, py);
              ctx.lineTo(px + size * 3.2, py);
              ctx.moveTo(px, py - size * 3.2);
              ctx.lineTo(px, py + size * 3.2);
              ctx.stroke();
            }

            ctx.restore();

            if (depthRatio > 0.72 && projectedStars.length < 45) {
              projectedStars.push({ px, py, alpha });
            }
          }

          // Render faint 4D Spacetime Geodesic Worldlines between close guide stars
          ctx.save();
          ctx.lineWidth = 0.4;
          for (let i = 0; i < projectedStars.length; i++) {
            for (let j = i + 1; j < projectedStars.length; j++) {
              const dx = projectedStars[i].px - projectedStars[j].px;
              const dy = projectedStars[i].py - projectedStars[j].py;
              const distSq = dx * dx + dy * dy;
              if (distSq < 13000) { // ~114px apart
                const lineAlpha = (1 - distSq / 13000) * 0.16 * Math.min(projectedStars[i].alpha, projectedStars[j].alpha);
                ctx.strokeStyle = '#45D5F2';
                ctx.globalAlpha = lineAlpha;
                ctx.beginPath();
                ctx.moveTo(projectedStars[i].px, projectedStars[i].py);
                ctx.lineTo(projectedStars[j].px, projectedStars[j].py);
                ctx.stroke();
              }
            }
          }
          ctx.restore();

          // Render Gravitational Spacetime Wave Ripples
          for (let i = ripples.length - 1; i >= 0; i--) {
            const r = ripples[i];
            r.radius += (r.maxRadius - r.radius) * 0.08;
            r.alpha *= 0.93;

            ctx.save();
            ctx.strokeStyle = '#38bdf8';
            ctx.globalAlpha = r.alpha;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            if (r.alpha < 0.02) {
              ripples.splice(i, 1);
            }
          }

          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      })();
    </script>
