    <style>
      /* --- Smooth 3D & Global Transitions --- */
      html {
        scroll-behavior: smooth;
        background-color: #040711;
      }
      
      body {
        background-color: #040711;
        overflow-x: hidden;
      }

      /* Subtle glowing hover & smooth transitions on cards and buttons */
      button, a, input, select, textarea {
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }

      /* Image loading smoothness */
      img {
        transition: opacity 0.35s ease-in-out, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform, opacity;
      }

      /* Custom Sleek Cosmic Scrollbar */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: #040711;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #38bdf8;
      }

      /* 3D Cosmic Background Canvas */
      #afterlight-3d-cosmic-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 0;
        opacity: 0.85;
      }

      #root {
        position: relative;
        z-index: 1;
      }
    
      /* --- Space Telescope Authentic Physics & Animations --- */
      @keyframes cosmicGalaxyDrift {
        0% {
          transform: rotate(0deg) scale(1.02);
        }
        50% {
          transform: rotate(2.4deg) scale(1.055);
        }
        100% {
          transform: rotate(-1.6deg) scale(1.02);
        }
      }

      @keyframes cosmicCorePulse {
        0%, 100% {
          opacity: 0.62;
          transform: scale(0.96);
          filter: brightness(1) drop-shadow(0 0 35px rgba(69, 213, 242, 0.45));
        }
        50% {
          opacity: 0.94;
          transform: scale(1.07);
          filter: brightness(1.22) drop-shadow(0 0 65px rgba(69, 213, 242, 0.85));
        }
      }

      @keyframes diffractionSpikePulse {
        0%, 100% {
          opacity: 0.55;
          transform: scale(0.92);
        }
        50% {
          opacity: 0.95;
          transform: scale(1.08);
        }
      }

      @keyframes reticleScanRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes astrometricBlink {
        0%, 100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.9;
        }
      }

      /* Microscopic Astronomical Sensor Photon Shot Noise */
      .astronomical-photon-grain {
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 4px 4px;
        pointer-events: none;
      }

      /* Optical 4-Point Space Telescope Diffraction Cross */
      .diffraction-spike-star {
        position: absolute;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .diffraction-spike-star::before {
        content: "";
        position: absolute;
        width: 1px;
        height: 52px;
        background: linear-gradient(to bottom, transparent, rgba(186, 230, 253, 0.9) 45%, #ffffff 50%, rgba(186, 230, 253, 0.9) 55%, transparent);
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.7);
      }
      .diffraction-spike-star::after {
        content: "";
        position: absolute;
        height: 1px;
        width: 52px;
        background: linear-gradient(to right, transparent, rgba(186, 230, 253, 0.9) 45%, #ffffff 50%, rgba(186, 230, 253, 0.9) 55%, transparent);
        box-shadow: 0 0 6px rgba(56, 189, 248, 0.7);
      }
      .diffraction-core-dot {
        width: 5px;
        height: 5px;
        border-radius: 9999px;
        background-color: #ffffff;
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.9), 0 0 20px rgba(67, 136, 255, 0.7);
        z-index: 2;
      }

    </style>
  </head>
  <body>
    <!-- Hardware-accelerated 3D Starfield & Particle Warp Canvas -->
    <canvas id="afterlight-3d-cosmic-canvas"></canvas>
    
    <div id="root"></div>

    <script>
      (function() {
        const canvas = document.getElementById('afterlight-3d-cosmic-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const numStars = 320;
        const stars = [];
        const focalLength = 400;
        let mouseX = 0, mouseY = 0;
        let targetAngleX = 0, targetAngleY = 0;
        let angleX = 0, angleY = 0;

        const starColors = [
          '#ffffff', // Pure white
          '#bae6fd', // Pale cyan (A-type)
          '#7dd3fc', // Electric sky (B-type)
          '#c084fc', // Soft ultraviolet nebula
          '#fde047', // Solar warm gold
          '#f472b6'  // Infrared dust glow
        ];

        for (let i = 0; i < numStars; i++) {
          stars.push({
            x: (Math.random() - 0.5) * 2200,
            y: (Math.random() - 0.5) * 2200,
            z: Math.random() * 1000 + 1,
            size: Math.random() * 1.8 + 0.6,
            color: starColors[Math.floor(Math.random() * starColors.length)],
            speed: Math.random() * 0.4 + 0.25,
            twinkle: Math.random() * 0.03 + 0.01,
            phase: Math.random() * Math.PI * 2
          });
        }

        window.addEventListener('resize', () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        window.addEventListener('mousemove', (e) => {
          mouseX = (e.clientX - width / 2) / (width / 2);
          mouseY = (e.clientY - height / 2) / (height / 2);
          targetAngleX = mouseX * 0.35;
          targetAngleY = mouseY * 0.25;
        });

        let lastTime = performance.now();

        function animate(time) {
          const delta = Math.min((time - lastTime) / 1000, 0.1);
          lastTime = time;

          // Smooth lerp for 3D camera rotation
          angleX += (targetAngleX - angleX) * 0.06;
          angleY += (targetAngleY - angleY) * 0.06;

          ctx.clearRect(0, 0, width, height);

          const cx = width / 2;
          const cy = height / 2;

          for (let i = 0; i < numStars; i++) {
            const star = stars[i];

            // Move star towards camera (cosmic depth forward flight)
            star.z -= star.speed * (delta * 60);
            if (star.z <= 1) {
              star.z = 1000;
              star.x = (Math.random() - 0.5) * 2200;
              star.y = (Math.random() - 0.5) * 2200;
            }

            // 3D Rotation with mouse angle
            const cosX = Math.cos(angleX);
            const sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY);
            const sinY = Math.sin(angleY);

            // Rotate around Y then X
            let rx = star.x * cosX - star.z * sinX;
            let rz = star.x * sinX + star.z * cosX;
            let ry = star.y * cosY - rz * sinY;
            rz = star.y * sinY + rz * cosY;

            if (rz <= 10) continue;

            // 3D Perspective Projection
            const k = focalLength / rz;
            const px = rx * k + cx;
            const py = ry * k + cy;

            if (px < -20 || px > width + 20 || py < -20 || py > height + 20) continue;

            // Depth-based brightness & size
            const depthRatio = 1 - (rz / 1000);
            star.phase += star.twinkle;
            const twinkleAlpha = 0.65 + Math.sin(star.phase) * 0.35;
            const alpha = Math.max(0.1, Math.min(1, depthRatio * twinkleAlpha));
            const size = Math.max(0.6, star.size * k * 0.45);

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = star.color;
            ctx.shadowBlur = depthRatio > 0.6 ? 8 : 0;
            ctx.shadowColor = star.color;

            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();

            // Rare optical diffraction spike on close stars
            if (depthRatio > 0.75 && star.size > 1.4) {
              ctx.lineWidth = 0.5;
              ctx.strokeStyle = star.color;
              ctx.beginPath();
              ctx.moveTo(px - size * 3, py);
              ctx.lineTo(px + size * 3, py);
              ctx.moveTo(px, py - size * 3);
              ctx.lineTo(px, py + size * 3);
              ctx.stroke();
            }

            ctx.restore();
          }

          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      })();
    </script>
  </body>
